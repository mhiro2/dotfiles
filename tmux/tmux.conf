#=======================================================
# Tmux configuration file (for tmux 3.6a or above)
#=======================================================
# - Session options ('set-option [-g]' or 'set [-g]')
# - Window options  ('set-window-option [-g]' or 'setw [-g]')

#-----------------------------
# Prefix
#-----------------------------

unbind-key C-b
set-option -g prefix C-t

#-----------------------------
# Plugins
#-----------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

#-----------------------------
# General settings
#-----------------------------

# No delay for escape key press
set-option -s escape-time 0

# Use login shell
set-option -g default-shell $SHELL

# Keep the window's name fixed
set-option -g allow-rename off

# Display time
set-option -g display-time 3500

# Renumber windows when a window is closed
set-option -g renumber-windows on

# Index starts from 1
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Scrollback buffer size
set-option -g history-limit 10000

# Use vi keybind in copy mode
set-window-option -g mode-keys vi

# Enable mouse support
set-option -g mouse on

# Enable modern key reporting for terminals that support it
set-option -g extended-keys on

# Notify terminal applications about focus changes
set-option -g focus-events on

# Clipboard integration
set-option -g set-clipboard on
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'set-option -g copy-command "pbcopy"' \
  'set-option -g copy-command "cat"'

# Terminal capabilities
set-option -g terminal-features[3] 'xterm-256color:clipboard:extkeys:RGB'
set-option -g terminal-features[4] 'tmux-256color:clipboard:extkeys:RGB'
set-option -g terminal-features[5] 'screen-256color:clipboard'

#-----------------------------
# Plugin settings
#-----------------------------

# tmux-resurrect
set-option -g @resurrect-save 'S'
set-option -g @resurrect-restore 'R'

#-----------------------------
# Key bindings
#-----------------------------

# for nested tmux
bind-key C-t send-prefix

# Display pane
bind-key i display-panes

# Switch session
bind-key N switch-client -n
bind-key P switch-client -p

# Create windows and panes from current path
bind-key c new-window -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Move between panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Copy
bind-key v copy-mode \; display "Copy mode"
bind-key -Tcopy-mode-vi v send -X begin-selection
bind-key -Tcopy-mode-vi C-v send -X rectangle-toggle
bind-key -Tcopy-mode-vi V send -X select-line
bind-key -Tcopy-mode-vi y send -X copy-pipe-and-cancel
bind-key -Tcopy-mode-vi Enter send -X copy-pipe-and-cancel
bind-key -Tcopy-mode-vi C-c send -X cancel
bind-key -Tcopy-mode-vi C-a send -X start-of-line
bind-key -Tcopy-mode-vi C-e send -X end-of-line

# Paste
bind-key p paste-buffer
bind-key Space choose-buffer

# Synchronize panes
bind-key e setw synchronize-panes on
bind-key E setw synchronize-panes off

#-----------------------------
# Appearance
#-----------------------------

# Use true color
set-option -g default-terminal "tmux-256color"

# Default statusbar colors
set-option -g status-style "fg=cyan,bg=black,default"

# Default window title colors
set-window-option -g window-status-style "fg=colour244,bg=default"

# Active window title colors
set-window-option -g window-status-current-style "fg=colour166,bg=default"

# Pane border
set-option -g pane-border-style "fg=colour235"
set-option -g pane-active-border-style "fg=colour240"

# Message text
set-option -g message-style "fg=colour166,bg=colour235"

# Pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# Clock
set-window-option -g clock-mode-colour colour64 #green

# Status line
set-option -g status on
set-option -g status-interval 2
set-option -g status-justify "left"
set-option -g status-left-length 60
set-option -g status-right-length 90
set-option -g status-left '#[fg=colour234,bg=colour148,bold] #S #[default] '
set-option -g status-right '#{?#{==:#{client_key_table},prefix},#[fg=colour16#,bg=colour220#,bold] PREFIX #[default] ,}#{?pane_in_mode,#[fg=colour16#,bg=colour208#,bold] COPY #[default] ,}#{?synchronize-panes,#[fg=colour15#,bg=colour160#,bold] SYNC #[default] ,}#[fg=colour245,bg=colour236] %Y-%m-%d %H:%M #[default]'

#-----------------------------
# TPM
#-----------------------------

if-shell 'test -x "$HOME/.config/tmux/plugins/tpm/tpm"' \
  'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"' \
  'display-message "TPM is not installed; run make tpm"'
